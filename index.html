<html>
<head>
	<meta charset="utf-8"/>
	<title>Papier Game Football - Remastered Edition</title>
	<style>
		*{
			box-sizing: border-box;
		}
		body{
			background-color: #565656;
			color: #ccc;
			text-align: center;
		}
		canvas{
			background-color:#565656;
		}
		*{
			margin:0%;
		}
		.flex{
			display: flex;
		}
		.flexw{
			display: flex;
			flex-wrap: wrap;
			flex-direction: row;
		}
		.flexc{
			display: flex;
		}
		.w30{
			width: 30%;
		}
		.w33{
			width: 33%;
		}
		.w70{
			width: 70%;
		}
		.w100{
			width: 100%;
		}
		.h33{
			height: 33%;
		}
		.h100{
			height: 100%;
		}
		.b1{
			border: 1px #cce solid;
		}
	</style>
	<script src="bta.js"></script>	
</head>
<body>
	<div class="flex flexw w100 h100">
		<div class="w30 h100 b1">
			<div class="w100 b1">
				<br>
				<h1> Football Remastered - RL </h1>
				<h3> Version 0.3 -- 26.05.2026 </h3>
				<br>
				<hr>
				<br>
				<h2 id="stan"></h2>
				<br>
				<hr>
				<br>
				<div class="flex">
					<div class="w30">
						Board Width: <br>
						Board Height:
					</div>
					<div class="w70" style="display: flex; justify-content: center;">
						<div class="w70">
							<input style="text-align: center;" class="w100" id="wdh" value="10"/> <br>
							<input style="text-align: center;" class="w100" id="hgh" value="14"/>
						</div>
					</div>
					<br>
					<br>
					<br>
				</div>
			</div>
			<div class="w100 h33 flexw">
				<div class="w33 h33"> <input class="w100 h100" type="submit" value="NW" onclick="KeyClick(81)"> </div>
				<div class="w33 h33"> <input class="w100 h100" type="submit" value="N" onclick="KeyClick(87)"> </div>
				<div class="w33 h33"> <input class="w100 h100" type="submit" value="NE" onclick="KeyClick(69)"> </div>
				<div class="w33 h33"> <input class="w100 h100" type="submit" value="W" onclick="KeyClick(65)"> </div>
				<div class="w33 h33"> <input class="w100 h100" type="submit" value="NEW GAME" onclick="StartNewGame()"> </div>
				<div class="w33 h33"> <input class="w100 h100" type="submit" value="E" onclick="KeyClick(68)"> </div>
				<div class="w33 h33"> <input class="w100 h100" type="submit" value="SW" onclick="KeyClick(90)"> </div>
				<div class="w33 h33"> <input class="w100 h100" type="submit" value="S" onclick="KeyClick(88)"> </div>
				<div class="w33 h33"> <input class="w100 h100" type="submit" value="SE" onclick="KeyClick(67)"> </div>
			</div>
			<div>
				<br>
				<h2> Difficulty: </h2>
				<input style="text-align: center;" class="w33" id="level" type="number" value="3" min="1" max="3" onchange="fixLevel()">
				<p> You may change difficulty during match </p>
			</div>
		</div>
		<div class="w70 h100 b1">
			<canvas></canvas>
		</div>
	</div>
	<script src="main.js"></script>	
</body>
</html>
