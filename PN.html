<html>
<head>
	<meta charset="utf-8"/>
	<title>PN</title>
	<style>
		canvas{
			background-color:#565656;
		}
		.half{
			float:left;
			width:200px;
			height:50px;
		}
		input{
			width:46%;
			height:100%;
			float:left;
		}
		p{
			margin:0%;
		}
	</style>
</head>
<body>
	<div class="half" style="width:300px;">
		<h2 id="stan"><p onclick="Start()">START</p></h2>
	</div>
	<div class="half">
		<input id="wdh" value="10"/> <p style="float:left">X</p> <input id="hgh" value="16"/>
	</div>
	<div class="half">
		<input type="submit" value="Nowa Gra" onclick="StartNewGame()"/>
	</div>
	<div style="clear:both"></div>
	<canvas>
	</canvas>
	<script>
		const canvas=document.querySelector("canvas");
		const ctx= canvas.getContext("2d");
		
		var iw=10; // ilość pól na palanszy; po szerokości
		var ih=16; // ... i po wysokości
		var cw=canvas.width=(iw+2)*50;
		var ch=canvas.height=(ih+4)*50;		
		
		var gamer; // znaczy się gracz, tak? (EDIT: Tak.)
		
		var x=iw/2; // koordynaty punktu początkowego / pozycji piłki
		var y=ih/2; // i to też ;]
		
		var punkty=[]; // tablica opisująca dla każdego punktu dostępne drogi,  zgodnie z ruchem
						// wskazówek zegara, zaczyynając od góry: indeks 0-7; jest i óseemka, ale wyleciało do czego;
						// 0 - ścieżka otwarta, 1 - ścieżka zamknięta (trivia: po zsumowaniu do 8: brak dalszej drogi)
		
		var punkty_SI; // uh, oh.. jeszcze raz: do czego to było?
		var copy_x; // kopia robocza aktualnego położenia piłki
		var copy_y; // ... j.w.
		var actual=[0,x,y]; // tablica jakaś... i ma trzy (słownie:3 ) wartośći... tyle wiadomo... duh.
		var actual_copy=[]; // .... serio? popatrz linię wyżej, broski..
		var choose_tab=[]; // nie wiem, co to, ale to ostatnie czego zapomniałem. Następny proszę.
		var tab_punkty=[];
		
		var endgame=0;
		
		var Table = {
			color:"white",
			draw_yourself: function(){
				ctx.fillStyle=this.color;
				ctx.fillRect(cw/(iw+2),2*ch/(ih+4),cw*iw/(iw+2),ch*ih/(ih+4));
				ctx.fillRect(iw/2*cw/(iw+2),ch/(ih+4),cw/(iw+2)*2,ch/(ih+4));
				ctx.fillRect(iw/2*cw/(iw+2),ch/(ih+4)*(ih+1),cw/(iw+2)*2,2*ch/(ih+4));
			}
		}
		
		var Table_line = {
			color:"gray",
			draw_yourself: function(){
				ctx.fillStyle=this.color;
				for(i=0;i<=iw;i++){
					punkty[i]=[];
					for(j=0;j<=ih;j++){
						if(i==0 && j==0) punkty[i][j]=[1,1,1,0,1,1,1,1];
						else if(i==0 && j==ih) punkty[i][j]=[1,0,1,1,1,1,1,1];
						else if(i==iw && j==0) punkty[i][j]=[1,1,1,1,1,0,1,1];
						else if(i==iw && j==ih) punkty[i][j]=[1,1,1,1,1,1,1,0];
						else if(i==0) punkty[i][j]=[1,0,0,0,1,1,1,1];
						else if(j==0) punkty[i][j]=[1,1,1,0,0,0,1,1];
						else if(i==iw) punkty[i][j]=[1,1,1,1,1,0,0,0];
						else if(j==ih) punkty[i][j]=[0,0,1,1,1,1,1,0];	
						else punkty[i][j]=[0,0,0,0,0,0,0,0];
						if(i!=iw && j!=ih || (j==ih && (i==iw/2 || i==iw/2-1))){
						ctx.fillRect(cw/(iw+2)*(i+1),(j+2)*ch/(ih+4),cw/(iw+2),1);
						ctx.fillRect(cw/(iw+2)*(i+1),(j+2)*ch/(ih+4),1,ch/(ih+4));
						ctx.fillRect(cw/(iw+2)*(i+1),(j+3)*ch/(ih+4)-1,cw/(iw+2),1);
						ctx.fillRect(cw/(iw+2)*(i+2)-1,(j+2)*ch/(ih+4),1,ch/(ih+4));
						}
					}
				}
				j=-1;
				for(i=iw/2-1;i<=iw/2;i++){
					ctx.fillRect(cw/(iw+2)*(i+1),(j+2)*ch/(ih+4),cw/(iw+2),1);
					ctx.fillRect(cw/(iw+2)*(i+1),(j+2)*ch/(ih+4),1,ch/(ih+4));
					ctx.fillRect(cw/(iw+2)*(i+1),(j+3)*ch/(ih+4)-1,cw/(iw+2),1);
					ctx.fillRect(cw/(iw+2)*(i+2)-1,(j+2)*ch/(ih+4),1,ch/(ih+4));				
				}
				punkty[iw/2-1][-1]=[1,1,1,0,1,1,1,1];
				punkty[iw/2][-1]=[1,1,1,0,0,0,1,1];
				punkty[iw/2+1][-1]=[1,1,1,1,1,0,1,1];
				punkty[iw/2-1][0]=[1,0,0,0,0,0,1,1];
				punkty[iw/2][0]=[0,0,0,0,0,0,0,0];
				punkty[iw/2+1][0]=[1,1,1,0,0,0,0,0];	


				punkty[iw/2-1][ih+1]=[1,0,1,1,1,1,1,1];
				punkty[iw/2][ih+1]=[0,0,1,1,1,1,1,0];
				punkty[iw/2+1][ih+1]=[1,1,1,1,1,1,1,0];
				punkty[iw/2-1][ih]=[0,0,0,0,1,1,1,0];
				punkty[iw/2][ih]=[0,0,0,0,0,0,0,0];
				punkty[iw/2+1][ih]=[0,0,1,1,1,0,0,0];				
			}
		}

		
		var ball = {
			ruch: function(color, pos){
				if((punkty[x][y][pos]==0 || pos==8) && endgame==0){
					console.log(x,y,punkty[x][y]);
					if(pos!=8) punkty[x][y][pos]=1;
					if(pos!=8 && color=="red") ball.ruch("red", 8);
					if(pos==0){
						ctx.fillStyle=color;
						for(i=0;i<cw/(iw+2)*1-4;i++) ctx.fillRect(cw/(iw+2)*(x+1)-2,(y+2)*ch/(ih+4)-i,5,-4);
						x+=0;
						y-=1;
					}
					if(pos==8){
						ctx.fillStyle=color;
						ctx.fillRect(cw/(iw+2)*(x+1)-2,(y+2)*ch/(ih+4)-2,5,5);
						x+=0;
						y-=0;
					}					
					if(pos==1){
						fillStyle=color;
						for(i=0;i<cw/(iw+2)*1-4;i++) ctx.fillRect(cw/(iw+2)*(x+1)+i,(y+2)*ch/(ih+4)-i,4,-4);
						punkty[x][y][pos]=1;
						x+=1;
						y-=1;
					}
					if(pos==2){
						fillStyle=color;
						for(i=0;i<cw/(iw+2)*1-4;i++) ctx.fillRect(cw/(iw+2)*(x+1)+i,(y+2)*ch/(ih+4)-2,+4,5);				
						x+=1;
						y-=0;
					}
					if(pos==3){
						fillStyle=color;
						for(i=0;i<cw/(iw+2)*1-4;i++) ctx.fillRect(cw/(iw+2)*(x+1)+i,(y+2)*ch/(ih+4)+i,4,4);				
						x+=1;
						y+=1;
					}
					if(pos==4){
						ctx.fillStyle=color;
						for(i=0;i<cw/(iw+2)*1-4;i++) ctx.fillRect(cw/(iw+2)*(x+1)-2,(y+2)*ch/(ih+4)+i,5,4);				
						x+=0;
						y+=1;
					}
					if(pos==5){
						fillStyle=color;
						for(i=0;i<cw/(iw+2)*1-4;i++) ctx.fillRect(cw/(iw+2)*(x+1)-i,(y+2)*ch/(ih+4)+i,-4,4);				
						x-=1;
						y+=1;
					}
					if(pos==6){
						fillStyle=color;
						for(i=0;i<cw/(iw+2)*1-4;i++) ctx.fillRect(cw/(iw+2)*(x+1)-i,(y+2)*ch/(ih+4)-2,-4,5);				
						x-=1;
						y+=0;
					}
					if(pos==7){
						fillStyle=color;
						for(i=0;i<cw/(iw+2)*1-4;i++) ctx.fillRect(cw/(iw+2)*(x+1)-i,(y+2)*ch/(ih+4)-i,-4,-4);			
						x-=1;
						y-=1;
					}
					av=pos;
					
					if(y==-1){
						End_Game(-1);
						return;
					} 
					if(y==ih+1){
						End_Game(1);
						return;
					} 
					
					if(av!=8){
						pos+=4;
						if(pos>=8) pos-=8;
						punkty[x][y][pos]=1;
						console.log(x,y,punkty[x][y]);					
						suma=punkty[x][y][0]+punkty[x][y][1]+punkty[x][y][2]+punkty[x][y][3]+punkty[x][y][4]+punkty[x][y][5]+punkty[x][y][6]+punkty[x][y][7];
						if(suma>1 && suma<8) Turn("YT");
						else if(suma==8) End_Game(gamer);
						else Turn("YOT");
					}
				}
				else if(punkty[x][y][pos]==1 && pos!=8) ball.ruch("black", 8);
			}
		}
		
		function Your_Turn(){
			document.getElementById("stan").innerHTML="YOUR TURN";
			ball.ruch("black",8);
			gamer=1;
			if(y==-1) End_Game(-1);
			if(y==ih+1) End_Game(1);
		}
		function Your_Opponent_Turn(){
			document.getElementById("stan").innerHTML="YOUR OPPONENT";
			ball.ruch("blue",8);
			gamer=-1;
			if(y==ih+1) End_Game(-gamer);
			if(punkty[x][y][4]==0 && x!=1 && x!=(iw-1)) ball.ruch("blue",4);
			else if(punkty[x][y][5]==0 && x==1) ball.ruch("blue",5);			
			else if(punkty[x][y][3]==0 && x==(iw-1)) ball.ruch("blue",3);			
			else if(punkty[x][y][5]==0 && x>=1/2*iw) ball.ruch("blue",5);
			else if(punkty[x][y][3]==0 && x<=1/2*iw) ball.ruch("blue",3);
			else if(punkty[x][y][5]==0) ball.ruch("blue",5);
			else if(punkty[x][y][3]==0) ball.ruch("blue",3);			
			else if(punkty[x][y][2]==0) ball.ruch("blue",2);
			else if(punkty[x][y][6]==0) ball.ruch("blue",6);
			else if(punkty[x][y][1]==0) ball.ruch("blue",1);
			else if(punkty[x][y][7]==0) ball.ruch("blue",7);
			else if(punkty[x][y][0]==0) ball.ruch("blue",0);
			//SI_start();
			
		}
		
		function SI_start(){
			punkty_SI=punkty;
			tab_punkty[0]=punkty_SI;
			copy_x=x;
			copy_y=y;
			SI_reapet();
		}
		function Si_up(xxx){
			if(xxx==0){
				copy_x+=0;
				copy_y-=1;
			}
			else if(xxx==1){
				copy_x+=1;
				copy_y-=1;
			}
			else if(xxx==2){
				copy_x+=1;
				copy_y-=0;
			}
			else if(xxx==3){
				copy_x+=1;
				copy_y+=1;
			}
			else if(xxx==4){
				copy_x+=0;
				copy_y+=1;
			}
			else if(xxx==5){
				copy_x-=1;
				copy_y+=1;
			}
			else if(xxx==6){
				copy_x-=1;
				copy_y-=0;
			}
			else if(xxx==7){
				copy_x-=1;
				copy_y-=1;
			}
			if(xxx>=0 && xxx<=7){
				actual[actual.length]=xxx;
				actual[0]++;
				suma=punkty_SI[copy_x][copy_y][0]+punkty_SI[copy_x][copy_y][1]+punkty_SI[copy_x][copy_y][2]+punkty_SI[copy_x][copy_y][3]+punkty_SI[copy_x][copy_y][4]+punkty_SI[copy_x][copy_y][5]+punkty_SI[copy_x][copy_y][6]+punkty_SI[copy_x][copy_y][7];
				if(suma>1 && suma!=8) SI_reapet();
				console.log(copy_x, copy_y);
			}
		}
		function SI_reapet(){
			if(tab_punkty[actual[0]][copy_x][copy_y][4]==0){
				Si_up(4);
				actual[0]--;
			};		
			if(tab_punkty[actual[0]][copy_x][copy_y][5]==0) Si_up(5);
			if(tab_punkty[actual[0]][copy_x][copy_y][3]==0) Si_up(3);
			if(tab_punkty[actual[0]][copy_x][copy_y][2]==0) Si_up(2);
			if(tab_punkty[actual[0]][copy_x][copy_y][6]==0) Si_up(6);
			if(tab_punkty[actual[0]][copy_x][copy_y][1]==0) Si_up(1);
			if(tab_punkty[actual[0]][copy_x][copy_y][7]==0) Si_up(7);
			if(tab_punkty[actual[0]][copy_x][copy_y][0]==0) Si_up(0);
		}
		
		function Turn(abc){
			if((gamer==1 && abc=="YT") || (gamer==-1 && abc=="YOT")) Your_Turn();
			else if((gamer==1 && abc=="YOT") || (gamer==-1 && abc=="YT")) Your_Opponent_Turn();
		}
		function KeyClick(e){
			
			//ball.ruch("red",8);
			if(e==81 && gamer==1) ball.ruch("red",7);
			else if(e==87 && gamer==1) ball.ruch("red",0);
			else if(e==69 && gamer==1) ball.ruch("red",1);
			else if(e==68 && gamer==1) ball.ruch("red",2);
			else if(e==67 && gamer==1) ball.ruch("red",3);
			else if(e==88 && gamer==1) ball.ruch("red",4);
			else if(e==90 && gamer==1) ball.ruch("red",5);
			else if(e==65 && gamer==1) ball.ruch("red",6);
		}
		
		
		function Start(){
			Table.draw_yourself();
			Table_line.draw_yourself();
			x=iw/2;
			y=ih/2;
			a=Math.floor(Math.random()*1000+1);
			if(a%2==0) Your_Turn();
			else Your_Opponent_Turn();
		}
		
		function End_Game(gmr){
			ball.ruch("black", 8);
			endgame=1;
			if(gmr==-1) document.getElementById("stan").innerHTML="YOU WIN";
			if(gmr==1) document.getElementById("stan").innerHTML="COMPUTER WINS";
		}
		
		function StartNewGame(){
			iw=parseInt(document.getElementById("wdh").value);
			ih=parseInt(document.getElementById("hgh").value);
			endgame=0;
			cw=canvas.width=(iw+2)*50;
			ch=canvas.height=(ih+4)*50;		
			Start();
		}		
		window.addEventListener("keydown", function(e){console.log(e.keyCode); KeyClick(e.keyCode)});
		Start();
			
	</script>	
</body>
</html>
